<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex" />
    <title>og-image source (rendered to ../og-image.png by bin/og)</title>
    <link rel="stylesheet" href="../site.css" />
    <style>
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        padding: 64px 72px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        background:
          radial-gradient(52% 60% at 10% 0%, rgba(255, 92, 127, 0.28), transparent 70%),
          radial-gradient(58% 70% at 92% 20%, rgba(124, 92, 255, 0.4), transparent 70%), var(--bg);
      }
      .who {
        display: flex;
        align-items: center;
        gap: 18px;
        font-size: 30px;
        font-weight: 600;
      }
      .who img {
        width: 64px;
        height: 64px;
        border-radius: 50%;
      }
      h1 {
        font-size: 108px;
        line-height: 1;
        max-width: 1000px;
      }
      .foot {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        font-size: 26px;
        color: var(--muted);
        border-top: 2px solid var(--line);
        padding-top: 24px;
      }
      .foot b {
        color: var(--ruby);
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <p class="who"><img src="../avatar.jpg" alt="" />Navid Emad</p>
    <h1 class="sheen">Rails systems and AI agents that hold up in production.</h1>
    <p class="foot">
      <span>Lead Rails developer, agentic AI engineer</span>
      <b>navidemad.github.io</b>
    </p>
  </body>
</html>
